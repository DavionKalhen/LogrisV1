[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
solc = '0.8.26'
fs_permissions = [{ access = "read-write", path = "./dapp" }]
via_ir = true
optimizer = true
optimizer_runs = 200

remappings = [
  "forge-std=lib/forge-std/src",
  "@openzeppelin/contracts=lib/openzeppelin-contracts/contracts",
  "openzeppelin-contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts",
  "alchemix-v3/=alchemix-v3/",
  # Force alchemix-v3 to use our OpenZeppelin contracts
  "alchemix-v3/lib/openzeppelin-contracts/=lib/openzeppelin-contracts/",
  "alchemix-v3/lib/openzeppelin-contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/",
]

# See more config options https://github.com/foundry-rs/foundry/tree/master/config